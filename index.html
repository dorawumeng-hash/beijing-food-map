<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京美食地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶部标题栏 -->
<header class="app-header">
  <div class="header-inner">
    <h1>🍽️ 北京美食地图</h1>
    <p class="subtitle">Dora 私藏 · 探店指南</p>
  </div>
</header>

<!-- 主区域：左列表 + 右地图 -->
<div class="app-body">
  <!-- 左侧：餐厅列表 -->
  <aside class="restaurant-list" id="restaurantList">
    <div class="list-header">
      <h2>🏠 我的收藏餐厅</h2>
      <span class="count-badge" id="countBadge">0 家</span>
    </div>
    <!-- 分类筛选 -->
    <div class="category-bar" id="categoryBar"></div>
    <div class="list-scroll" id="listScroll"></div>
  </aside>

  <!-- 右侧：地图 -->
  <main class="map-container">
    <div id="map"></div>
  </main>
</div>

<!-- 餐厅详情弹窗 -->
<div class="detail-modal hidden" id="detailModal">
  <div class="modal-overlay" onclick="closeDetail()"></div>
  <div class="modal-content">
    <button class="modal-close" onclick="closeDetail()">✕</button>
    <div class="modal-images" id="modalImages"></div>
    <div class="modal-info">
      <h2 id="modalName"></h2>
      <div class="modal-tags" id="modalTags"></div>
      <p class="modal-desc" id="modalDesc"></p>
      <div class="modal-meta" id="modalMeta"></div>
      <!-- 迷你地图定位 -->
      <div class="mini-map-wrap">
        <div id="miniMap" class="mini-map"></div>
        <div class="mini-map-label" id="miniMapLabel"></div>
      </div>
      <a class="modal-link" id="modalLink" target="_blank" rel="noopener">查看原文 →</a>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>

<!-- 图片放大预览 -->
<div class="lightbox hidden" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="">
</div>
</body>
</html>
